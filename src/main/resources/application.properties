spring.application.name=issue-manage
server.port=${PORT:8080}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/issuemanagedb?sslmode=disable}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

security.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZVNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMw==}

security.jwt.expiration-ms=3600000
app.otp.expiry-minutes=10
app.mail.from=${SPRING_MAIL_FROM:noreply@example.com}
app.notifications.ticket-base-url=${APP_BASE_URL:http://localhost:8081}/tickets
app.notifications.retry-base-delay-ms=1000

# Gmail / Brevo SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-smtp-username}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-smtp-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google reCAPTCHA Configuration (set to false for demo, true for production)
app.captcha.enabled=${CAPTCHA_ENABLED:false}
google.recaptcha.secret=${RECAPTCHA_SECRET:your-recaptcha-secret-key}

server.error.include-message=always

# Required for SPA routing in ForwardController
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
